<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Vibrant Emerald Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Effect behind 'F' -->
  <circle cx="320" cy="240" r="110" fill="#10B981" opacity="0.18" filter="url(#emeraldGlow)" />

  <!-- Monogram IF Shapes -->
  <g>
    <!-- Letter 'I' (Serif Ink style in Pure White) -->
    <!-- Top Serif -->
    <rect x="114" y="140" width="90" height="28" rx="6" fill="#FFFFFF" />
    <!-- Center Stem -->
    <rect x="141" y="140" width="36" height="232" rx="4" fill="#FFFFFF" />
    <!-- Bottom Serif -->
    <rect x="114" y="344" width="90" height="28" rx="6" fill="#FFFFFF" />

    <!-- Letter 'F' (Modern Flow style in Vibrant Emerald Gradient) -->
    <!-- Vertical Stem -->
    <rect x="240" y="140" width="36" height="232" rx="8" fill="url(#brandGrad)" />
    <!-- Top Horizontal Bar -->
    <rect x="240" y="140" width="155" height="34" rx="8" fill="url(#brandGrad)" />
    <!-- Middle Horizontal Bar -->
    <rect x="240" y="236" width="125" height="32" rx="8" fill="url(#brandGrad)" />

    <!-- Ink Dot / Brand Accent -->
    <circle cx="395" cy="157" r="14" fill="#34D399" />
  </g>
</svg>
